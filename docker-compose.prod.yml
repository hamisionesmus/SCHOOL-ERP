services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted outbound-only mail relay (DKIM-signing) — see docs/DEPLOYMENT.md "Email" section
  # for the DNS records (DKIM TXT + PTR) that make this actually deliverable, not just sendable.
  postfix:
    image: boky/postfix
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: myschoolapp.xyz
      HOSTNAME: mail.myschoolapp.xyz
      DKIM_AUTOGENERATE: "true"
    volumes:
      - postfix_dkim:/etc/opendkim/keys

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      SMTP_HOST: postfix
      SMTP_PORT: 25
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE}
      API_PORT: 4000
      # Used to build links in outbound emails/SMS (activation link, login link) — without this,
      # they fall back to http://localhost:3000 and are broken for real recipients.
      WEB_ORIGIN: ${WEB_ORIGIN}
      MPESA_ENV: ${MPESA_ENV}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      ADVANTA_API_KEY: ${ADVANTA_API_KEY}
      ADVANTA_PARTNER_ID: ${ADVANTA_PARTNER_ID}
      ADVANTA_SENDER_ID: ${ADVANTA_SENDER_ID}
    volumes:
      - api_uploads:/app/uploads
      - api_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      postfix:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  api_uploads:
  api_backups:
  caddy_data:
  caddy_config:
  postfix_dkim:
