services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sized for the confirmed VPS: exactly 1 vCPU, 2-4GB RAM. The image's compiled-in default of
    # max_connections=100 doesn't fit this box's RAM budget safely alongside the app-side connection
    # pooling in TenantPrismaService/PlatformPrismaService (worst case ~53 connections at their tuned
    # defaults) — 60 leaves real headroom without over-promising memory the container doesn't have.
    # mem_limit is sized so shared_buffers + per-connection overhead can't OOM the host. No `cpus:`
    # ceiling here (or on any service below) — with only 1 physical core, a hard per-container CPU
    # quota doesn't add fairness protection the kernel's scheduler doesn't already provide (every
    # container still time-slices the single core fairly by default), it would only throttle
    # legitimate peak throughput below 100% of that one core even when nothing else is contending for
    # it. Docker also flat-out rejects any `cpus` value above the host's actual core count (confirmed:
    # "Range of CPUs is from 0.01 to 1.00, as there are only 1 CPUs available"), so per-service limits
    # summing to more than 1.0 (the original attempt here) can't work on this box at all.
    command: postgres -c max_connections=60 -c shared_buffers=128MB
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted outbound-only mail relay (DKIM-signing) — see docs/DEPLOYMENT.md "Email" section
  # for the DNS records (DKIM TXT + PTR) that make this actually deliverable, not just sendable.
  # Signs as hamzonetechnologies.com rather than myschoolapp.xyz — that domain's DNS zone is live
  # and editable, while myschoolapp.xyz's zone was found to be deprovisioned on the DNS host's end.
  # HOSTNAME is "relay", not "mail" — hamzonetechnologies.com already has a "mail" CNAME (a cPanel
  # default) and a CNAME can't coexist with the A record this relay's PTR setup needs at that name.
  postfix:
    image: boky/postfix
    restart: unless-stopped
    mem_limit: 128m
    environment:
      ALLOWED_SENDER_DOMAINS: hamzonetechnologies.com
      HOSTNAME: relay.hamzonetechnologies.com
      DKIM_AUTOGENERATE: "true"
    volumes:
      - postfix_dkim:/etc/opendkim/keys

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    # mem_limit is a ceiling, not a reservation — sized so a memory leak in this process can't OOM
    # the whole host (see postgres's comment above for why there's no cpus ceiling on this box).
    # Also configures the connection-pool tuning in TenantPrismaService/PlatformPrismaService (see
    # those files); defaults there already match postgres's max_connections=60 above, these env vars
    # just make it explicit/adjustable.
    mem_limit: 512m
    environment:
      DB_POOL_PER_TENANT: "3"
      DB_MAX_CACHED_TENANT_CLIENTS: "15"
      DB_POOL_PLATFORM: "8"
      SMTP_HOST: postfix
      SMTP_PORT: 25
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE}
      API_PORT: 4000
      # Used to build links in outbound emails/SMS (activation link, login link) — without this,
      # they fall back to http://localhost:3000 and are broken for real recipients.
      WEB_ORIGIN: ${WEB_ORIGIN}
      MPESA_ENV: ${MPESA_ENV}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      ADVANTA_API_KEY: ${ADVANTA_API_KEY}
      ADVANTA_PARTNER_ID: ${ADVANTA_PARTNER_ID}
      ADVANTA_SENDER_ID: ${ADVANTA_SENDER_ID}
    volumes:
      - api_uploads:/app/uploads
      - api_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      postfix:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  api_uploads:
  api_backups:
  caddy_data:
  caddy_config:
  postfix_dkim:
